name: PR Auto-Response

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 👋 Merci pour ta contribution !',
              '',
              'Avant review, vérifie que :',
              '',
              '- [ ] La CI passe (lint, typecheck, build)',
              '- [ ] Le titre suit le format `type: description`',
              '- [ ] Les commits sont en anglais',
              '- [ ] L\'UI reste en français',
              '- [ ] Aucun commentaire inutile dans le code',
              '',
              'Un mainteneur va review sous peu.',
              '',
              '---',
              '[📖 CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
