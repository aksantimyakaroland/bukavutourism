name: Issue Auto-Response

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isBug = context.payload.issue.body?.toLowerCase().includes('bug') || context.payload.issue.title?.toLowerCase().includes('bug');
            const labels = isBug ? ['bug'] : ['enhancement'];
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels
            });
            const body = isBug
              ? [
                  '## 🐳 Merci d\'avoir signalé ce bug',
                  '',
                  'L\'équipe va l\'examiner. En attendant, tu peux :',
                  '- Ajouter des étapes pour reproduire le problème',
                  '- Joindre une capture d\'écran',
                  '- Indiquer la page ou l\'URL concernée',
                  '',
                  '---',
                  '[📖 CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)'
                ].join('\n')
              : [
                  '## ✨ Merci pour ta suggestion !',
                  '',
                  'L\'équipe va l\'étudier. N\'hésite pas à :',
                  '- Détailler le cas d\'usage',
                  '- Proposer des alternatives',
                  '- Joindre des maquettes si possible',
                  '',
                  '---',
                  '[📖 CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)'
                ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
