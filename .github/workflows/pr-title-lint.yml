name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pattern = /^(feat|fix|docs|refactor|style|chore|ci|revert): .{1,80}$/i;
            const title = context.payload.pull_request.title;
            if (!pattern.test(title)) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ⚠️ Titre de PR invalide\n\nLe titre doit suivre le format `type: description`.\n\nTypes autorisés : `feat`, `fix`, `docs`, `refactor`, `style`, `chore`, `ci`, `revert`.\n\nExemple : `feat: add guide availability calendar`'
              });
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['invalid-title']
              });
              core.setFailed('PR title does not match conventional commit format');
            }
